name: Contributions en serpent

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#1e3a8a&color_dots=#ebedf0,#c7d7fe,#93b4fd,#3b82f6,#1e40af
            dist/snake-dark.svg?palette=github-dark&color_snake=#93c5fd&color_dots=#161b22,#1e3a8a,#1d4ed8,#3b82f6,#93c5fd
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
